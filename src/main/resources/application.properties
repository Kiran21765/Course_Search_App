spring.application.name=CourseSearch_App

# ---- MySQL (the database is created automatically on first start) ----
# Each value can be overridden with an environment variable (DB_URL, DB_USERNAME, DB_PASSWORD).
spring.jpa.open-in-view=false


spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Cloud platforms assign a dynamic PORT
server.port=${PORT:8080}



# ---- Logo upload limit ----
# (a little above the 1 MB image limit, because the upload request also carries form headers)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ---- JWT (secret must be at least 32 characters; set JWT_SECRET in production) ----
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-before-deploying}
app.jwt.expiration-ms=86400000

# ---- Provider access code: providers must enter this before they can sign in or sign up ----
app.provider.access-code=${PROVIDER_ACCESS_CODE:PROVIDER-2026}

# ---- Admin account created on first start. Leave the password empty to skip creating it. ----
app.admin.email=${ADMIN_EMAIL:admin@coursehub.example}
app.admin.password=${ADMIN_PASSWORD:admin12345}

# ---- CORS: the React dev server ----
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
